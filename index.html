<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>hordes</title>
    <link rel="stylesheet" href="css/style.css?v=1.8.11" />
  </head>
  <body>
    <canvas id="board"></canvas>
    <canvas id="map"></canvas>

    <div id="hud-bottom">
      <div class="hud-left">
        <div id="level-tally"><span id="tally-text"></span></div>
      </div>
      <div class="hud-mid"><span id="status-msg"></span></div>
      <div class="hud-right">
        <button id="btn-back" type="button">QUIT</button>
        <button id="btn-undo" type="button">UNDO</button>
        <button id="btn-hint" type="button">HINT</button>
        <button id="btn-reset" type="button">RESET</button>
      </div>
    </div>

    <div id="map-hud-top" class="map-hud" hidden>
      <div class="map-stat">
        <span class="map-stat-label">INFECTED</span>
        <span id="map-infected" class="map-stat-value">0</span>
      </div>
      <div class="map-stat">
        <span class="map-stat-label">DAY</span>
        <span class="map-stat-value"><span id="map-time">0</span><span id="map-hours-extra" class="map-hours-extra"></span></span>
      </div>
      <div class="map-stat">
        <span class="map-stat-label">CLEARS</span>
        <span id="map-clears" class="map-stat-value">0</span>
      </div>
      <div class="map-stat">
        <span class="map-stat-label">TRIES</span>
        <span id="map-tries" class="map-stat-value">0</span>
      </div>
      <div class="map-stat">
        <span class="map-stat-label">TIME</span>
        <span id="map-total-time" class="map-stat-value">0:00</span>
      </div>
    </div>
    <div id="map-hud-bottom" class="map-hud" hidden>
      <button id="btn-map-menu" type="button">BACK</button>
      <span id="map-status"></span><span id="map-tap-hint" hidden>TAP TO CONTINUE</span>
    </div>


    <div id="endless-hub" hidden>
      <div id="hub-stats">
        <div id="hub-wave-line" class="hub-line">WAVE <span id="hub-wave">1</span></div>
        <div id="hub-grid">
          <div class="hub-line">TIME <span id="hub-total-time">0:00</span></div>
          <div id="hub-avg-line" class="hub-line">AVG <span id="hub-avg">—</span></div>
          <div class="hub-line">RETRIES <span id="hub-retries">0</span></div>
          <div class="hub-line">PERFECTS <span id="hub-perfects">0</span></div>
        </div>
      </div>
      <div id="hub-hud-bottom" class="map-hud">
        <button id="btn-hub-back" type="button">BACK</button>
        <span id="hub-status"></span>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="start-panel">
        <h1>
          HORDES
          <span class="title-sub">in our cities</span>
        </h1>
        <div id="mode-row-continue" class="mode-row" hidden></div>
        <div id="mode-row-campaign" class="mode-row">
          <button id="btn-campaign" class="btn-title" type="button">Campaign</button>
        </div>
        <div id="mode-row-endless" class="mode-row">
          <button id="btn-endless" class="btn-title" type="button">Endless</button>
        </div>
        <button id="btn-help" class="btn-title" type="button">Help</button>
      </div>
      <a id="startEmail" href="https://x.com/just_bob" target="_blank" rel="noopener noreferrer">just_bob@X.com</a>
      <div id="startVer">v=1.8.11</div>
    </div>

    <div id="plan-screen" class="overlay plan-overlay" hidden>
      <div id="plan-row" class="plan-row"></div>
    </div>

    <div id="story-screen" class="overlay" hidden>
      <div id="story-slot"></div>
    </div>

    <script src="js/sprite.js?v=1.8.11"></script>
    <script src="js/cell.js?v=1.8.11"></script>
    <script src="js/footprint.js?v=1.8.11"></script>
    <script src="js/grid.js?v=1.8.11"></script>
    <script src="js/grid_builder.js?v=1.8.11"></script>
    <script src="js/save.js?v=1.8.11"></script>
    <script src="js/plan.js?v=1.8.11"></script>
    <script src="js/planner.js?v=1.8.11"></script>
    <script src="js/story.js?v=1.8.11"></script>
    <script src="js/chrome.js?v=1.8.11"></script>
    <script src="js/overmap.js?v=1.8.11"></script>
    <script src="js/overmap-draw.js?v=1.8.11"></script>
    <script src="js/map-view.js?v=1.8.11"></script>
    <script src="js/ui.js?v=1.8.11"></script>
    <script src="js/particles.js?v=1.8.11"></script>
    <script src="js/game.js?v=1.8.11"></script>
    <script src="js/mechanics.js?v=1.8.11"></script>
    <script src="js/drawing.js?v=1.8.11"></script>
    <script src="js/city-name-generator.js?v=1.8.11"></script>

    <script data-goatcounter="https://justbobonx.goatcounter.com/count"
        async
        src="https://gc.zgo.at/count.v5.js"
        crossorigin="anonymous"
        integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ"></script>
  </body>
</html>
