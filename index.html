<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>hordes</title>
    <link rel="stylesheet" href="css/style.css?v=0.4.8" />
  </head>
  <body>
    <canvas id="board"></canvas>

    <div id="hud">
      <div id="stamp-tray"></div>
    </div>

    <div id="hud-bottom">
      <div class="hud-left"><span id="wave-label">WAVE 1</span></div>
      <div class="hud-mid"><span id="status-msg"></span></div>
      <div class="hud-right">
        <button id="btn-back" type="button">BACK</button>
        <button id="btn-hint" type="button">HINT</button>
        <button id="btn-reset" type="button">RESET</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="start-panel">
        <h1>
          HORDES
          <span class="title-sub">in our cities</span>
        </h1>
        <button id="btn-start" class="btn-title" type="button">Let's Go!</button>
        <button id="btn-help" class="btn-title" type="button">Help</button>
      </div>
      <a id="startEmail" href="https://x.com/just_bob" target="_blank" rel="noopener noreferrer">just_bob@X.com</a>
      <div id="startVer">v=0.4.8</div>
    </div>

    <div id="plan-screen" class="overlay" hidden>
      <div id="plan-row" class="plan-row"></div>
      <button id="btn-plan-back" type="button">BACK</button>
    </div>

    <div id="story-screen" class="overlay" hidden>
      <div id="story-slot"></div>
    </div>

    <script src="js/sprite.js?v=0.4.8"></script>
    <script src="js/cell.js?v=0.4.8"></script>
    <script src="js/grid.js?v=0.4.8"></script>
    <script src="js/grid_builder.js?v=0.4.8"></script>
    <script src="js/save.js?v=0.4.8"></script>
    <script src="js/plan.js?v=0.4.8"></script>
    <script src="js/planner.js?v=0.4.8"></script>
    <script src="js/story.js?v=0.4.8"></script>
    <script src="js/chrome.js?v=0.4.8"></script>
    <script src="js/ui.js?v=0.4.8"></script>
    <script src="js/game.js?v=0.4.8"></script>
  </body>
</html>
