<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>horde</title>
    <link rel="stylesheet" href="css/style.css?v=0.1.4" />
  </head>
  <body>
    <canvas id="board"></canvas>

    <div id="hud">
      <div class="hud-left"><span id="stamp-left">0 LEFT</span></div>
      <div class="hud-mid"><span id="wave-label">WAVE 1</span></div>
      <div class="hud-right"><span id="score-clears">★ 0</span></div>
      <div id="stamp-tray"></div>
      <div id="lost-flag" hidden>LOST</div>
    </div>

    <div id="hud-bottom">
      <div class="hud-left">
        <button id="btn-menu" type="button">MENU</button>
      </div>
      <div class="hud-right">
        <button id="btn-reset" type="button">RESET</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="start-panel">
        <h1>
          horde
          <span class="title-sub">on the field</span>
        </h1>
        <button id="btn-start" class="btn-title" type="button">Into the Field</button>
        <button id="btn-help" class="btn-title" type="button">Help</button>
      </div>
      <a id="startEmail" href="https://x.com/just_bob" target="_blank" rel="noopener noreferrer">just_bob@X.com</a>
      <div id="startVer">v=0.1.4</div>
    </div>

    <div id="menu-screen" class="overlay" hidden>
      <div class="panel menu-panel">
        <button id="btn-reset-menu" type="button">RESET</button>
        <button id="btn-give-up" type="button">GIVE UP</button>
      </div>
    </div>

    <div id="plan-screen" class="overlay" hidden>
      <div id="plan-row" class="plan-row"></div>
      <button id="btn-plan-back" type="button">BACK</button>
    </div>

    <div id="story-screen" class="overlay" hidden>
      <div id="story-slot"></div>
    </div>

    <div id="end-screen" class="overlay" hidden>
      <div class="panel">
        <h1 id="end-title">The horde is gone!</h1>
        <div id="end-note" class="end-note"></div>
        <div id="end-time" class="end-time">0:00</div>
        <button id="btn-end" type="button">NEXT</button>
      </div>
    </div>

    <script src="js/cell.js?v=0.1.4"></script>
    <script src="js/grid.js?v=0.1.4"></script>
    <script src="js/grid_builder.js?v=0.1.4"></script>
    <script src="js/save.js?v=0.1.4"></script>
    <script src="js/plan.js?v=0.1.4"></script>
    <script src="js/story.js?v=0.1.4"></script>
    <script src="js/chrome.js?v=0.1.4"></script>
    <script src="js/ui.js?v=0.1.4"></script>
    <script src="js/game.js?v=0.1.4"></script>
  </body>
</html>
